    <rect x="1242" y="400" width="12" height="12" rx="2"/>
  </g>

  <!-- player chrome -->
  <rect x="56" y="70" width="544" height="268" rx="20" fill="#101626" stroke="#2EE6D6" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="78" y="92" width="500" height="188" rx="10" fill="url(#screen)"/>

  <g clip-path="url(#screenClip)">
    <!-- sampled-window overlay -->
    <rect x="210" y="92" width="210" height="188" fill="url(#windowFill)"/>
    <rect x="210" y="92" width="2" height="188" fill="#2EE6D6" opacity="0.9"/>
    <rect x="418" y="92" width="2" height="188" fill="#8B7CFF" opacity="0.9"/>

    <!-- fake UI: cards + tab bar -->
    <rect x="98" y="110" width="210" height="14" rx="7" fill="#8B7CFF" opacity="0.85"/>
    <rect x="98" y="136" width="156" height="8" rx="4" fill="#9AA3B8" opacity="0.35"/>
    <rect x="98" y="154" width="320" height="48" rx="10" fill="#1B2744"/>
    <rect x="114" y="168" width="90" height="20" rx="6" fill="#2EE6D6" opacity="0.35"/>
    <rect x="214" y="172" width="180" height="12" rx="6" fill="#9AA3B8" opacity="0.28"/>
    <rect x="98" y="214" width="150" height="36" rx="10" fill="#1B2744"/>
    <rect x="260" y="214" width="150" height="36" rx="10" fill="#1B2744"/>
    <rect x="422" y="214" width="136" height="36" rx="10" fill="#24204A"/>

    <!-- phone overlay -->
    <rect x="470" y="108" width="92" height="168" rx="16" fill="#0B1020" stroke="#F5F7FF" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="478" y="122" width="76" height="8" rx="4" fill="#2EE6D6" opacity="0.55"/>
    <rect x="478" y="138" width="76" height="44" rx="8" fill="#1B2744"/>
    <rect x="478" y="190" width="36" height="28" rx="6" fill="#8B7CFF" opacity="0.55"/>
    <rect x="518" y="190" width="36" height="28" rx="6" fill="#2EE6D6" opacity="0.28"/>
    <rect x="490" y="248" width="52" height="6" rx="3" fill="#9AA3B8" opacity="0.4"/>
  </g>

  <!-- play mark -->
  <circle cx="328" cy="186" r="26" fill="#070B16" fill-opacity="0.55" stroke="#2EE6D6" stroke-width="1.5"/>
  <polygon points="320,172 320,200 346,186" fill="#2EE6D6"/>

  <!-- timeline -->
  <rect x="90" y="296" width="476" height="22" rx="11" fill="#0A1020"/>
  <rect x="98" y="304" width="460" height="6" rx="3" fill="#1A2340"/>
  <rect x="210" y="302" width="168" height="10" rx="5" fill="#2EE6D6" opacity="0.85"/>
  <circle cx="210" cy="307" r="6" fill="#F5F7FF"/>
  <text x="90" y="336" fill="#9AA3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">t = 01:15</text>
  <text x="318" y="336" fill="#2EE6D6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">window 3 min</text>
  <text x="498" y="336" fill="#9AA3B8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="end">sampled ~1 fps</text>

  <!-- copy -->
  <text x="656" y="128" fill="#2EE6D6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">AGENT SKILL  ·  GEMINI PIXELS</text>
  <text x="656" y="186" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="800">
    <tspan fill="#F5F7FF">Neoyn</tspan><tspan fill="#2EE6D6">GPT</tspan>
  </text>
  <text x="656" y="234" fill="#8B7CFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700">:video-to-code</text>
  <text x="656" y="278" fill="#C9D0E3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">Watch the pixels. Map the motion. Fix the repo.</text>

  <!-- pills -->
  <rect x="656" y="310" width="118" height="32" rx="16" fill="#122033" stroke="#2EE6D6" stroke-opacity="0.5"/>
  <text x="715" y="331" text-anchor="middle" fill="#2EE6D6" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">YouTube</text>
  <rect x="786" y="310" width="148" height="32" rx="16" fill="#16122E" stroke="#8B7CFF" stroke-opacity="0.55"/>
  <text x="860" y="331" text-anchor="middle" fill="#C4BBFF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">Screen recording</text>
  <rect x="946" y="310" width="118" height="32" rx="16" fill="#23180E" stroke="#FFB86B" stroke-opacity="0.55"/>
  <text x="1005" y="331" text-anchor="middle" fill="#FFB86B" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">Your repo</text>
</svg>
