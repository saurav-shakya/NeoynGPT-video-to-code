    <rect x="1170" y="8" width="12" height="12" rx="2"/><rect x="1206" y="8" width="12" height="12" rx="2"/>
    <rect x="1242" y="8" width="12" height="12" rx="2"/>
    <rect x="18" y="400" width="12" height="12" rx="2"/><rect x="54" y="400" width="12" height="12" rx="2"/>
    <rect x="90" y="400" width="12" height="12" rx="2"/><rect x="126" y="400" width="12" height="12" rx="2"/>
    <rect x="162" y="400" width="12" height="12" rx="2"/><rect x="198" y="400" width="12" height="12" rx="2"/>
    <rect x="234" y="400" width="12" height="12" rx="2"/><rect x="270" y="400" width="12" height="12" rx="2"/>
    <rect x="306" y="400" width="12" height="12" rx="2"/><rect x="342" y="400" width="12" height="12" rx="2"/>
    <rect x="378" y="400" width="12" height="12" rx="2"/><rect x="414" y="400" width="12" height="12" rx="2"/>
    <rect x="450" y="400" width="12" height="12" rx="2"/><rect x="486" y="400" width="12" height="12" rx="2"/>
    <rect x="522" y="400" width="12" height="12" rx="2"/><rect x="558" y="400" width="12" height="12" rx="2"/>
    <rect x="594" y="400" width="12" height="12" rx="2"/><rect x="630" y="400" width="12" height="12" rx="2"/>
