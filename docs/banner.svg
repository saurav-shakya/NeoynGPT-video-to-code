    <rect x="1026" y="400" width="12" height="12" rx="2"/><rect x="1062" y="400" width="12" height="12" rx="2"/>
    <rect x="1098" y="400" width="12" height="12" rx="2"/><rect x="1134" y="400" width="12" height="12" rx="2"/>
