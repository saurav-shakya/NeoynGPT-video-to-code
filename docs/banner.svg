    <rect x="954" y="8" width="12" height="12" rx="2"/><rect x="990" y="8" width="12" height="12" rx="2"/>
    <rect x="1026" y="8" width="12" height="12" rx="2"/><rect x="1062" y="8" width="12" height="12" rx="2"/>
