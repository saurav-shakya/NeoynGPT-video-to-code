<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">NeoynGPT:video-to-code</title>
  <desc id="desc">Gemini watches public YouTube or a screen recording, then your agent maps on-screen UI and motion onto the open repo.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0A1022"/>
      <stop offset="100%" stop-color="#0B0818"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="24%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#2EE6D6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2EE6D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="82%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162038"/>
      <stop offset="100%" stop-color="#0E1528"/>
    </linearGradient>
    <linearGradient id="windowFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2EE6D6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#D7DBF0"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="78" y="92" width="500" height="188" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glowCyan)"/>
  <rect width="1280" height="420" fill="url(#glowViolet)"/>

  <!-- faint grid -->
  <g stroke="#8B93A7" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 70h1280M0 140h1280M0 210h1280M0 280h1280M0 350h1280"/>
    <path d="M160 28v364M320 28v364M480 28v364M640 28v364M800 28v364M960 28v364M1120 28v364"/>
  </g>

  <!-- film strips -->
  <rect x="0" y="0" width="1280" height="28" fill="#05070E"/>
  <rect x="0" y="392" width="1280" height="28" fill="#05070E"/>
  <g fill="#1A2033">
    <rect x="18" y="8" width="12" height="12" rx="2"/><rect x="54" y="8" width="12" height="12" rx="2"/>
    <rect x="90" y="8" width="12" height="12" rx="2"/><rect x="126" y="8" width="12" height="12" rx="2"/>
    <rect x="162" y="8" width="12" height="12" rx="2"/><rect x="198" y="8" width="12" height="12" rx="2"/>
